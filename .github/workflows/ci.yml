name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_call:

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: bash scripts/format.sh check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-unit.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-docker.sh

  smoke:
    name: Build, smoke and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/smoke-test.sh
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - run: bash scripts/test-e2e.sh
