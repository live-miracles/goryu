name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Daily on the default branch, so a flaky end-to-end scenario or a drifted runner image
    # shows up as a pattern across days and not only on whichever push hit it.
    - cron: "17 3 * * *"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install clang-format==21.1.8 # keep equal to CLANG_FORMAT_MAJOR in scripts/format.sh
      - run: bash scripts/format.sh check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-unit.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-docker.sh

  smoke:
    name: Build, smoke and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/smoke-test.sh
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - run: bash scripts/test-e2e.sh
