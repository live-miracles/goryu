name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi

      - name: Build release archive
        run: bash scripts/build-release.sh

      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: build/goryu-linux-x86_64.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails if the release already exists: a published release is never
          # overwritten. Fix forward with a new version instead.
          # Notes are written by hand in .github/release-notes/<tag>.md before the tag
          # is pushed; a missing file falls back to the generated list of commits.
          notes_file=".github/release-notes/$GITHUB_REF_NAME.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            echo "::warning::$notes_file is missing; publishing generated notes"
            notes_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            build/goryu-linux-x86_64.tar.gz \
            build/checksums.sha256 \
            --verify-tag \
            --title "goryu $GITHUB_REF_NAME" \
            "${notes_args[@]}"

  image:
    name: Build and publish Docker image
    # The image installs the published release, so it can only be built once the
    # release above exists. (A release created with GITHUB_TOKEN does not trigger
    # other workflows, which is why this is a job here and not its own workflow.)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_IMAGE: nandisha0/goryu
      # Secrets cannot be used in `if:` directly; an empty value means Docker Hub
      # publishing is not set up, and the image goes to GHCR only.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_IMAGE }},enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # v3.4.0 -> :3.4.0 and :3.4, plus :latest (added for a release tag, not a pre-release).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          platforms: linux/amd64
          build-args: GORYU_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check the pushed image runs the tagged release
        run: |
          set -euo pipefail
          version="$(docker run --rm "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}" --version)"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Image reports $version, expected $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - if: env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: 'Bonded SRT relay: merges an SRT bonding group into one stream for SRS, MediaMTX and Restreamer'
          readme-filepath: docker/README.dockerhub.md
