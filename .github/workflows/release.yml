name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi

      - name: Build release archive
        run: bash scripts/build-release.sh

      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: build/goryu-linux-x86_64.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails if the release already exists: a published release is never
          # overwritten. Fix forward with a new version instead.
          gh release create "$GITHUB_REF_NAME" \
            build/goryu-linux-x86_64.tar.gz \
            build/checksums.sha256 \
            --verify-tag \
            --title "goryu $GITHUB_REF_NAME" \
            --generate-notes
