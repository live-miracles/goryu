<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How Goryu fits in</title>
  <desc id="d">Without Goryu, a bonded SRT group over two links is rejected by an SRT server such as SRS, MediaMTX or Restreamer. With Goryu in between, the two legs are merged and deduplicated and forwarded as one plain SRT stream that the server accepts.</desc>
  <style>
    :root { --fg: #1f2328; --muted: #59636e; --box: #f6f8fa; --line: #d0d7de; --link: #0969da; --ok: #1a7f37; --bad: #cf222e; --goryu: #ddf4ff; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --muted: #9198a1; --box: #161b22; --line: #3d444d; --link: #58a6ff; --ok: #3fb950; --bad: #f85149; --goryu: #0c2d6b; }
    }
    text { fill: var(--fg); font-size: 15px; }
    .muted { fill: var(--muted); font-size: 13px; }
    .label { fill: var(--muted); font-size: 12px; text-anchor: middle; }
    .row { fill: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .title { font-weight: 600; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .goryu { fill: var(--goryu); stroke: var(--link); stroke-width: 2; }
    .link { stroke: var(--link); stroke-width: 2.5; fill: none; }
    .bad { stroke: var(--bad); stroke-width: 2.5; stroke-dasharray: 6 5; fill: none; }
    .ok { stroke: var(--ok); stroke-width: 3; fill: none; }
    .pill-bad { fill: none; stroke: var(--bad); stroke-width: 1.5; }
    .pill-ok { fill: none; stroke: var(--ok); stroke-width: 1.5; }
    .t-bad { fill: var(--bad); font-weight: 600; font-size: 13px; text-anchor: middle; }
    .t-ok { fill: var(--ok); font-weight: 600; font-size: 13px; text-anchor: middle; }
    .mid { text-anchor: middle; }
  </style>
  <defs>
    <marker id="a-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>

  <!-- Without Goryu -->
  <text class="row" x="20" y="28">Without Goryu</text>
  <rect class="box" x="20" y="44" width="150" height="72" rx="10"/>
  <text class="title mid" x="95" y="74">Encoder</text>
  <text class="muted mid" x="95" y="96">one SRT group</text>
  <path class="bad" d="M170 68 H658" marker-end="url(#a-bad)"/>
  <path class="bad" d="M170 92 H658" marker-end="url(#a-bad)"/>
  <text class="label" x="270" y="62">link A</text>
  <text class="label" x="270" y="108">link B</text>
  <rect class="pill-bad" x="395" y="66" width="110" height="28" rx="14" style="fill: var(--box)"/>
  <text class="t-bad" x="450" y="85">✕ rejected</text>
  <rect class="box" x="660" y="44" width="220" height="72" rx="10"/>
  <text class="title mid" x="770" y="74">Any SRT server</text>
  <text class="muted mid" x="770" y="96">SRS · MediaMTX · Restreamer</text>

  <!-- With Goryu -->
  <text class="row" x="20" y="176">With Goryu</text>
  <rect class="box" x="20" y="192" width="150" height="72" rx="10"/>
  <text class="title mid" x="95" y="222">Encoder</text>
  <text class="muted mid" x="95" y="244">one SRT group</text>
  <path class="link" d="M170 216 H328" marker-end="url(#a-link)"/>
  <path class="link" d="M170 240 H328" marker-end="url(#a-link)"/>
  <text class="label" x="249" y="210">link A</text>
  <text class="label" x="249" y="256">link B</text>
  <rect class="goryu" x="330" y="184" width="190" height="88" rx="12"/>
  <text class="title mid" x="425" y="219" style="font-size:18px">Goryu</text>
  <text class="muted mid" x="425" y="242">merges the legs</text>
  <text class="muted mid" x="425" y="260">drops duplicates</text>
  <path class="ok" d="M520 228 H658" marker-end="url(#a-ok)"/>
  <text class="label" x="589" y="218">one plain SRT stream</text>
  <rect class="pill-ok" x="534" y="238" width="110" height="28" rx="14" style="fill: var(--box)"/>
  <text class="t-ok" x="589" y="257">✓ accepted</text>
  <rect class="box" x="660" y="192" width="220" height="72" rx="10"/>
  <text class="title mid" x="770" y="222">Any SRT server</text>
  <text class="muted mid" x="770" y="244">SRS · MediaMTX · Restreamer</text>

  <text class="muted" x="20" y="312">Same streamid in and out. If one link fails, the other leg keeps the stream going and the server never notices.</text>
</svg>
